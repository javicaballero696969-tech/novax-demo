<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaX — Crypto Exchange Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#08111f;color:#eaf1ff}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:25px;font-weight:900}.muted{color:#91a0b8}.card{background:#101c2e;border:1px solid #20314b;border-radius:18px;padding:18px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.two{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-top:16px}.auth{max-width:430px;margin:8vh auto}.input{width:100%;padding:13px;border-radius:11px;border:1px solid #30425e;background:#0a1525;color:white;margin:7px 0 12px}.primary{background:#54e1a3;color:#062017}.danger{background:#ff6b7d;color:#25050b}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{background:#17263b;color:#b9c6d9}.tab.active{background:#54e1a3;color:#062017}.price{font-size:20px;font-weight:800}.pos{color:#54e1a3}.neg{color:#ff8090}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #213149}.hidden{display:none}.small{font-size:13px}.notice{padding:10px 12px;background:#182b44;border-radius:10px;margin-bottom:14px;color:#b9c9df}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{align-items:flex-start}.wrap{padding:12px}.card{padding:14px}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
const app=document.getElementById("app");let token=localStorage.getItem("novax_token"), timer;
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2}).format(n||0);
async function api(path,opt={}){opt.headers={...(opt.headers||{}),"Content-Type":"application/json"};if(token)opt.headers.Authorization="Bearer "+token;const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function loginView(){app.innerHTML=`<div class="auth card"><div class="brand">NovaX</div><p class="muted">Simulated crypto exchange prototype</p><div class="tabs"><button class="tab active" id="l">Sign in</button><button class="tab" id="r">Create account</button></div><div id="form"></div></div>`;showLogin();document.getElementById("l").onclick=showLogin;document.getElementById("r").onclick=showRegister}
function showLogin(){document.getElementById("form").innerHTML=`<input class="input" id="email" placeholder="Email" type="email"><input class="input" id="password" placeholder="Password" type="password"><button class="primary" style="width:100%" onclick="doLogin()">Sign in</button><p id="msg" class="small"></p>`}
function showRegister(){document.getElementById("form").innerHTML=`<input class="input" id="name" placeholder="Full name"><input class="input" id="email" placeholder="Email" type="email"><input class="input" id="password" placeholder="Password (6+ characters)" type="password"><button class="primary" style="width:100%" onclick="doRegister()">Create account</button><p id="msg" class="small"></p>`}
async function doLogin(){try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});token=d.token;localStorage.setItem("novax_token",token);dashboard()}catch(e){msg.textContent=e.message}}
async function doRegister(){try{const d=await api("/api/register",{method:"POST",body:JSON.stringify({name:name.value,email:email.value,password:password.value})});token=d.token;localStorage.setItem("novax_token",token);dashboard()}catch(e){msg.textContent=e.message}}
async function dashboard(){let me;try{me=await api("/api/me")}catch{token=null;localStorage.removeItem("novax_token");return loginView()}app.innerHTML=`<div class="top"><div><div class="brand">NovaX</div><div class="muted small">SIMULATION MODE • Welcome, ${me.name}</div></div><button class="danger" onclick="logout()">Log out</button></div><div class="notice">Demo only — balances and trades are simulated. No real cryptocurrency or money is moved.</div><div id="market" class="grid"></div><div class="two"><div class="card"><h2>Trade</h2><div class="tabs"><button class="tab active" id="buy">Buy</button><button class="tab" id="sell">Sell</button></div><select class="input" id="coin"><option>BTC</option><option>ETH</option><option>SOL</option><option>XRP</option><option>BNB</option></select><input class="input" id="qty" type="number" step="any" placeholder="Amount"><button class="primary" style="width:100%" onclick="trade()">Place simulated trade</button><p id="tradeMsg" class="small"></p></div><div class="card"><h2>Profile</h2><div id="profile"></div></div></div><div class="two"><div class="card"><h2>Portfolio</h2><div id="portfolio"></div></div><div class="card"><h2>Recent activity</h2><div id="activity"></div></div></div>`;window.side="buy";buy.onclick=()=>{side="buy";buy.classList.add("active");sell.classList.remove("active")};sell.onclick=()=>{side="sell";sell.classList.add("active");buy.classList.remove("active")};refresh();clearInterval(timer);timer=setInterval(refresh,5000)}
async function refresh(){try{const [m,p,t,me]=await Promise.all([api("/api/market"),api("/api/portfolio"),api("/api/trades"),api("/api/me")]);document.getElementById("market").innerHTML=Object.entries(m).map(([s,x])=>`<div class="card"><b>${s}</b><div class="muted small">${x.name}</div><div class="price">${money(x.price)}</div><div class="${x.change>=0?"pos":"neg"}">${x.change>=0?"+":""}${x.change}%</div></div>`).join("");profile.innerHTML=`<div class="row"><span>Name</span><b>${me.name}</b></div><div class="row"><span>Email</span><b>${me.email}</b></div><div class="row"><span>Account</span><b>Demo</b></div><div class="row"><span>Joined</span><span>${new Date(me.created_at).toLocaleDateString()}</span></div>`;portfolio.innerHTML=`<div class="row"><span>Total value</span><b>${money(p.totalValue)}</b></div>`+p.balances.map(x=>`<div class="row"><span>${x.asset}</span><span>${Number(x.amount).toFixed(6)}<br><span class="muted small">${money(x.value)}</span></span></div>`).join("");activity.innerHTML=t.length?t.slice(0,8).map(x=>`<div class="row"><span><b>${x.side.toUpperCase()}</b> ${x.symbol}<br><span class="muted small">${new Date(x.created_at).toLocaleString()}</span></span><span>${Number(x.amount).toFixed(6)}<br>${money(x.total)}</span></div>`).join(""):"<span class='muted'>No trades yet.</span>"}catch(e){}}
async function trade(){try{await api("/api/trade",{method:"POST",body:JSON.stringify({symbol:coin.value,side:window.side,amount:Number(qty.value)})});tradeMsg.textContent="Trade completed.";qty.value="";refresh()}catch(e){tradeMsg.textContent=e.message}}
function logout(){localStorage.removeItem("novax_token");token=null;clearInterval(timer);loginView()}
token?dashboard():loginView();
</script></body></html>
